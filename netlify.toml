# Alternativ till GitHub Pages. Netlify bygger vid varje push.
# OBS: Netlify uppdaterar inte priser av sig själv. Lägg nycklarna som miljövariabler i Netlify
# och trigga en "build hook" minst var 12:e timme (t.ex. från GitHub Actions), annars visas inga priser.
[build]
  command = "npm run fetch --if-present; npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
