<svg class="scene" id="scene" viewBox="0 0 520 440" role="img" aria-label="Hörlurar, mobiltelefon, högtalare, smartklocka och laddare som svävar ovanför en hylla">
  <defs>
    <linearGradient id="hg-spk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f5590"/><stop offset="1" stop-color="#0d3157"/></linearGradient>
    <linearGradient id="hg-scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a8ddff"/><stop offset=".55" stop-color="#6cb8f0"/><stop offset="1" stop-color="#8b7cf6"/></linearGradient>
    <linearGradient id="hg-pk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff86a8"/><stop offset="1" stop-color="#e2416f"/></linearGradient>
    <linearGradient id="hg-eq" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff5c8a"/><stop offset="1" stop-color="#ffd1de"/></linearGradient>
    <linearGradient id="hg-shelf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1d4a75" stop-opacity="0"/><stop offset=".2" stop-color="#2a5f93"/><stop offset=".8" stop-color="#2a5f93"/><stop offset="1" stop-color="#1d4a75" stop-opacity="0"/></linearGradient>
    <radialGradient id="hg-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8fd3ff" stop-opacity=".38"/><stop offset="1" stop-color="#8fd3ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="hg-glow2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff5c8a" stop-opacity=".3"/><stop offset="1" stop-color="#ff5c8a" stop-opacity="0"/></radialGradient>
  </defs>

  <g class="ly" style="--d:6">
    <circle cx="260" cy="200" r="210" fill="url(#hg-glow)"/>
    <circle cx="350" cy="140" r="130" fill="url(#hg-glow2)"/>
  </g>

  <g class="ly" style="--d:10">
    <ellipse class="orbit" cx="260" cy="215" rx="225" ry="74" fill="none" stroke="#8fd3ff" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="3 11"/>
  </g>

  <!-- Hylla -->
  <g class="ly" style="--d:8">
    <rect x="18" y="352" width="484" height="14" rx="7" fill="url(#hg-shelf)"/>
    <ellipse cx="118" cy="352" rx="64" ry="5" fill="#000" opacity=".3"/>
    <ellipse cx="262" cy="352" rx="58" ry="5" fill="#000" opacity=".3"/>
    <ellipse cx="410" cy="352" rx="58" ry="5" fill="#000" opacity=".3"/>
  </g>

  <!-- Mobil med equalizer -->
  <g class="ly" style="--d:18"><g class="fl">
    <rect x="200" y="70" width="124" height="246" rx="24" fill="#04111f"/>
    <rect x="208" y="80" width="108" height="226" rx="17" fill="url(#hg-scr)"/>
    <rect x="243" y="86" width="38" height="7" rx="3.5" fill="#04111f"/>
    <rect x="220" y="108" width="84" height="11" rx="5.5" fill="#ffffffaa"/>
    <rect x="220" y="128" width="56" height="9" rx="4.5" fill="#ffffff70"/>
    <rect x="220" y="152" width="84" height="96" rx="14" fill="#0a2540" opacity=".88"/>
    <g class="eq" fill="url(#hg-eq)">
      <rect class="b b1" x="232" y="190" width="8" height="44" rx="4"/>
      <rect class="b b2" x="245" y="190" width="8" height="44" rx="4"/>
      <rect class="b b3" x="258" y="190" width="8" height="44" rx="4"/>
      <rect class="b b4" x="271" y="190" width="8" height="44" rx="4"/>
      <rect class="b b5" x="284" y="190" width="8" height="44" rx="4"/>
    </g>
    <circle class="pulse" cx="262" cy="174" r="7" fill="#ff5c8a"/>
    <rect x="220" y="262" width="84" height="12" rx="6" fill="#ffffff88"/>
    <rect x="220" y="282" width="40" height="10" rx="5" fill="#ffffff55"/>
  </g></g>

  <!-- Hörlurar -->
  <g class="ly" style="--d:26"><g class="fl d2">
    <path d="M60 262 C60 160 176 160 176 262" fill="none" stroke="#f4f8fb" stroke-width="16" stroke-linecap="round"/>
    <rect x="42" y="246" width="42" height="84" rx="19" fill="url(#hg-pk)"/>
    <rect x="152" y="246" width="42" height="84" rx="19" fill="url(#hg-pk)"/>
    <rect x="49" y="255" width="10" height="62" rx="5" fill="#ffffff66"/>
    <rect x="159" y="255" width="10" height="62" rx="5" fill="#ffffff66"/>
  </g></g>

  <!-- Högtalare med ljudvågor -->
  <g class="ly" style="--d:22">
    <g class="rings" fill="none" stroke="#8fd3ff" stroke-width="2.5">
      <circle class="ring r1" cx="410" cy="270" r="40"/>
      <circle class="ring r2" cx="410" cy="270" r="40"/>
      <circle class="ring r3" cx="410" cy="270" r="40"/>
    </g>
    <g class="fl d3">
      <rect x="354" y="188" width="112" height="152" rx="28" fill="url(#hg-spk)" stroke="#3a74ad" stroke-width="2"/>
      <circle class="cone" cx="410" cy="270" r="38" fill="#071a2e"/>
      <circle cx="410" cy="270" r="25" fill="#123a60"/>
      <circle cx="410" cy="270" r="10" fill="#8fd3ff"/>
      <circle cx="410" cy="215" r="12" fill="#071a2e"/>
      <rect x="374" y="196" width="72" height="5" rx="2.5" fill="#8fd3ff" opacity=".6"/>
    </g>
  </g>

  <!-- Smartklocka med puls -->
  <g class="ly" style="--d:34"><g class="fl d4">
    <rect x="76" y="44" width="30" height="104" rx="10" fill="#1d4a75"/>
    <rect x="62" y="66" width="58" height="58" rx="17" fill="#0a2540" stroke="#3a74ad" stroke-width="2"/>
    <rect x="68" y="72" width="46" height="46" rx="12" fill="#04111f"/>
    <path class="ecg" d="M72 97 h9 l4 -10 l6 20 l5 -14 l4 6 h12" fill="none" stroke="#ff5c8a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  </g></g>

  <!-- Laddare -->
  <g class="ly" style="--d:30"><g class="fl d5">
    <rect x="426" y="62" width="58" height="66" rx="13" fill="#f4f8fb" stroke="#0a2540" stroke-width="3"/>
    <rect x="440" y="48" width="7" height="16" rx="2" fill="#c9d6e0"/>
    <rect x="463" y="48" width="7" height="16" rx="2" fill="#c9d6e0"/>
    <path class="bolt" d="M459 74 L446 96 H458 L452 114 L470 88 H458 Z" fill="#ff5c8a"/>
  </g></g>

  <!-- Gnistor -->
  <g class="ly" style="--d:40" fill="#ffffff">
    <path class="tw t1" d="M168 70 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3z"/>
    <path class="tw t2" d="M372 130 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2z"/>
    <path class="tw t3" d="M34 190 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2z"/>
    <path class="tw t4" d="M488 196 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3z"/>
    <circle class="tw t5" cx="330" cy="40" r="2.5"/>
    <circle class="tw t6" cx="140" cy="128" r="2"/>
  </g>
  <!-- Jul: tomteluva och paket (visas bara i jultemat) -->
  <g class="xmas">
    <g class="ly" style="--d:22"><g class="fl d3">
      <path d="M368 196 C376 150 412 128 452 142 C440 152 432 170 448 196 Z" fill="#e23b4e"/>
      <path d="M368 196 C376 150 412 128 452 142" fill="none" stroke="#ff6b7e" stroke-width="3" opacity=".6"/>
      <rect x="360" y="188" width="96" height="16" rx="8" fill="#fff"/>
      <circle cx="455" cy="142" r="10" fill="#fff"/>
    </g></g>
    <g class="ly" style="--d:12">
      <g class="gift g1"><rect x="476" y="310" width="38" height="40" rx="4" fill="#2e9e6b"/><rect x="492" y="310" width="6" height="40" fill="#ffd166"/><rect x="476" y="324" width="38" height="6" fill="#ffd166"/><path d="M495 310 c-10 -12 -18 -4 -10 2 M495 310 c10 -12 18 -4 10 2" fill="none" stroke="#ffd166" stroke-width="4" stroke-linecap="round"/></g>
      <g class="gift g2"><rect x="10" y="318" width="34" height="32" rx="4" fill="#e23b4e"/><rect x="24" y="318" width="6" height="32" fill="#fff"/><rect x="10" y="330" width="34" height="6" fill="#fff"/><path d="M27 318 c-9 -10 -16 -3 -9 2 M27 318 c9 -10 16 -3 9 2" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></g>
      <g class="gift g3"><rect x="326" y="326" width="26" height="24" rx="3" fill="#b69cff"/><rect x="336" y="326" width="5" height="24" fill="#fff"/><rect x="326" y="335" width="26" height="5" fill="#fff"/></g>
    </g>
  </g>
</svg>
